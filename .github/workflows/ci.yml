name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true  # non-blocking until all TS errors resolved

      - name: Build
        run: npx next build
        env:
          # Provide dummy env so the build doesn't crash on missing vars
          ADMIN_EMAIL: ci@test.local
          ADMIN_PASSWORD: ci-test-password
          AUTH_SECRET: ci-auth-secret-placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-token
